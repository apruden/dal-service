groups:
  - name: dal-node
    rules:
      - alert: DALStorageFailed
        expr: dal_storage_failed == 1
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "DAL storage has failed on {{ $labels.instance }}"
          runbook: "docs/operations/alerts.md#dalstoragefailed"

      - alert: DALDiskHeadroomLow
        expr: (dal_storage_filesystem_available_bytes / dal_storage_filesystem_total_bytes < 0.45) and (dal_storage_filesystem_available_bytes / dal_storage_filesystem_total_bytes >= 0.40)
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "DAL data filesystem on {{ $labels.instance }} is below 45% free"
          runbook: "docs/operations/alerts.md#daldiskheadroomlow"

      - alert: DALDiskHeadroomCritical
        expr: dal_storage_filesystem_available_bytes / dal_storage_filesystem_total_bytes < 0.40
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "DAL data filesystem on {{ $labels.instance }} is below the 40% free-space floor"
          runbook: "docs/operations/alerts.md#daldiskheadroomcritical"

      - alert: DALDiskCapacitySampleFailed
        expr: dal_storage_filesystem_sample_ok == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "DAL cannot sample data filesystem capacity on {{ $labels.instance }}"
          runbook: "docs/operations/alerts.md#daldiskcapacitysamplefailed"

      - alert: DALPartitionNotRecovering
        expr: dal_partition_recovery_ready == 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "DAL partition {{ $labels.partition }} is not ready on {{ $labels.instance }}"
          runbook: "docs/operations/alerts.md#dalpartitionnotrecovering"

      - alert: DALMetaTermChurn
        expr: changes(dal_meta_current_term[10m]) >= 3
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "DAL meta Raft term is changing repeatedly on {{ $labels.instance }}"
          runbook: "docs/operations/alerts.md#dalrafttermchurn"

      - alert: DALPartitionTermChurn
        expr: changes(dal_partition_current_term[10m]) >= 3
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "DAL partition {{ $labels.partition }} Raft term is changing repeatedly on {{ $labels.instance }}"
          runbook: "docs/operations/alerts.md#dalrafttermchurn"

      - alert: DALLeaderQuorumAckStale
        expr: dal_meta_quorum_ack_age_milliseconds > 10000 or dal_partition_quorum_ack_age_milliseconds > 10000
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "DAL leader on {{ $labels.instance }} has not observed a quorum acknowledgement for over 10 seconds"
          runbook: "docs/operations/alerts.md#dalleaderquorumackstale"

      - alert: DALMaterializationLagGrowing
        expr: dal_partition_oldest_pending_milliseconds > 60000
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "DAL partition {{ $labels.partition }} materialization is over one minute behind"
          runbook: "docs/operations/alerts.md#dalmaterializationlaggrowing"

      - alert: DALClientOpHighLatency
        expr: histogram_quantile(0.99, sum by (instance, le) (rate(dal_client_op_gateway_duration_seconds_bucket[5m]))) > 0.75
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "DAL client operation gateway p99 exceeds 750 ms on {{ $labels.instance }}"
          runbook: "docs/operations/alerts.md#dalclientophighlatency"

      - alert: DALLogDrops
        expr: increase(dal_log_dropped_lines_total[5m]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "DAL diagnostic logs are being dropped on {{ $labels.instance }}"
          runbook: "docs/operations/alerts.md#dallogdrops"

      - alert: DALAuthorizationDenialsSpike
        expr: increase(dal_authorization_denials_total[5m]) >= 20
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "DAL is rejecting many authenticated requests on {{ $labels.instance }}"
          runbook: "docs/operations/alerts.md#dalauthorizationdenialsspike"
