[package]
name = "dal-service"
version = "0.1.0"
edition = "2024"

[lib]
name = "dal"
path = "src/lib.rs"

[[bin]]
name = "dal"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
rocksdb = "0.22"
thiserror = "1"
bytes = "1"
tracing = "0.1"
fail = "0.5"
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
futures = "0.3"
zmq = "0.10"

[dev-dependencies]
tempfile = "3"
proptest = "1"
fail = { version = "0.5", features = ["failpoints"] }

[features]
# Enables the `fail` crate's runtime-toggleable crash points. Off in normal
# builds so `fail_point!` compiles to nothing; tests enable it explicitly.
failpoints = ["fail/failpoints"]
